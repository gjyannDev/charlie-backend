[project]
name = "charlie-backend"
version = "0.1.0"
description = "Charlie Backend API"
authors = [
    {name = "GjyannDev"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "alembic (==1.17.0)",
    "annotated-types (==0.7.0)",
    "anyio (==4.11.0)",
    "argon2-cffi (==25.1.0)",
    "argon2-cffi-bindings (==25.1.0)",
    "cffi (==2.0.0)",
    "click (==8.3.0)",
    "cryptography (==46.0.2)",
    "ecdsa (==0.19.1)",
    "email-validator (==2.3.0)",
    "fastapi-starter-kit (==0.1.15)",
    "greenlet (==3.2.4)",
    "h11 (==0.16.0)",
    "idna (==3.11)",
    "mako (==1.3.10)",
    "markupsafe (==3.0.3)",
    "passlib (==1.7.4)",
    "pyasn1 (==0.6.1)",
    "pycparser (==2.23)",
    "pydantic (==2.12.0)",
    "pydantic-settings (==2.11.0)",
    "pydantic-core (==2.41.1)",
    "python-dotenv (==1.1.1)",
    "python-jose (==3.5.0)",
    "rsa (==4.9.1)",
    "six (==1.17.0)",
    "sniffio (==1.3.1)",
    "sqlalchemy (==2.0.44)",
    "starlette (==0.48.0)",
    "typing-inspection (==0.4.2)",
    "typing-extensions (==4.15.0)",
    "uvicorn (==0.37.0)",
    "fastapi[standard] (==0.119.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
